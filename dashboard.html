<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{font-family:-apple-system,system-ui,Arial,sans-serif;background:#111;color:#fff;margin:0;padding:18px}
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  .box{background:#1c1c1e;border-radius:18px;padding:16px;min-height:90px}
  .clock{font-size:42px;line-height:1}
  .quote{font-size:18px;opacity:.75}
  .timerBox{text-align:center}
  #timer{font-size:54px;margin:6px 0 10px}
  button{font-size:22px;padding:10px 14px;margin:5px;border-radius:12px;border:0}
  .tasks{grid-column:span 3;font-size:26px;line-height:1.3}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0}
  .label{opacity:.7;min-width:86px}
  .taskText{flex:1}
  .doneBtn{font-size:18px;padding:8px 12px;border-radius:12px}
  .small{font-size:14px;opacity:.65;margin-top:8px}
</style>
</head>
<body>

<div class="grid">
  <div class="box">
    <div class="clock" id="clock">--:--</div>
    <div class="small" id="mode">MODE: —</div>
  </div>

  <div class="box timerBox">
    <div id="timer">50:00</div>
    <button onclick="startTimer(50)">50</button>
    <button onclick="startTimer(25)">25</button>
    <button onclick="startTimer(5)">Break</button>
  </div>

  <div class="box quote" id="quote">Stay consistent, not perfect.</div>

  <div class="box tasks">
    <div class="row">
      <div class="label">NOW</div>
      <div class="taskText" id="nowTask">—</div>
      <button class="doneBtn" onclick="markDone('focus')">Done</button>
    </div>
    <div class="row">
      <div class="label">NEXT</div>
      <div class="taskText" id="nextTask">—</div>
      <button class="doneBtn" onclick="markDone('admin')">Done</button>
    </div>
    <div class="row">
      <div class="label">LATER</div>
      <div class="taskText" id="laterTask">—</div>
      <button class="doneBtn" onclick="markDone('creative')">Done</button>
    </div>
    <div class="small">Tip: keep tasks “one sitting” sized.</div>
  </div>
</div>

<script>
  // ====== CONFIG ======
  var API_URL = "https://script.google.com/macros/s/AKfycbw_bqVsxfz3hKlfoqdWXYBjRnYXIs_Flchi4svbdLUL6QsY9uIjLmg91yq4EpGx8q3R/exec";
  var TOKEN   = "c4m-desk-2026-!9x";

  // ====== CLOCK + MODE ======
  function pad(n){return (n<10?'0':'')+n}
  function tickClock(){
    var d=new Date();
    document.getElementById('clock').innerHTML = pad(d.getHours())+':'+pad(d.getMinutes());
    document.getElementById('mode').innerHTML = "MODE: " + currentModeLabel_(d);
  }
  function currentModeLabel_(d){
    // Based on your schedule (Mon–Wed: 7:30–17:30; Thu ends 16:00; Fri ends 12:00; evenings optional)
    // We keep it simple: focus/admin/creative/off based on time-of-day.
    var h=d.getHours(), m=d.getMinutes();
    var mins = h*60+m;

    // Focus: 07:30–10:00
    if (mins>=450 && mins<600) return "FOCUS";
    // Admin: 10:00–13:00
    if (mins>=600 && mins<780) return "ADMIN";
    // Creative: 13:00–17:30
    if (mins>=780 && mins<1050) return "CREATIVE";
    // Evening optional: 19:30–22:30
    if (mins>=1170 && mins<1350) return "EVENING";
    return "OFF";
  }
  setInterval(tickClock, 1000); tickClock();

  // ====== TIMER ======
  var tInt=null, tSec=50*60;
  function renderTimer(){
    var m=Math.floor(tSec/60), s=tSec%60;
    document.getElementById('timer').innerHTML = m+':'+(s<10?'0':'')+s;
  }
  function startTimer(mins){
    if(tInt) clearInterval(tInt);
    tSec=mins*60;
    renderTimer();
    tInt=setInterval(function(){
      tSec--;
      if(tSec<=0){ tSec=0; renderTimer(); clearInterval(tInt); tInt=null; return; }
      renderTimer();
    },1000);
  }

  // ====== API CALLS (XHR for older iOS) ======
  var latest = { focus:null, admin:null, creative:null };

  function xhrGet(url, cb){
    var x=new XMLHttpRequest();
    x.onreadystatechange=function(){
      if(x.readyState===4){
        if(x.status>=200 && x.status<300) cb(null, x.responseText);
        else cb(new Error("HTTP "+x.status));
      }
    };
    x.open("GET", url, true);
    x.send();
  }

  function xhrPost(url, obj, cb){
    var x=new XMLHttpRequest();
    x.onreadystatechange=function(){
      if(x.readyState===4){
        if(x.status>=200 && x.status<300) cb(null, x.responseText);
        else cb(new Error("HTTP "+x.status));
      }
    };
    x.open("POST", url, true);
    x.setRequestHeader("Content-Type", "text/plain;charset=utf-8");
    x.send(JSON.stringify(obj));
  }

  function loadTasks(){
    var url = API_URL + "?action=list&token=" + encodeURIComponent(TOKEN);
    xhrGet(url, function(err, text){
      if(err){ setTasks("—","—","—"); return; }
      var data;
      try{ data=JSON.parse(text); }catch(e){ setTasks("—","—","—"); return; }
      if(!data.rows){ setTasks("—","—","—"); return; }

      // first todo task per type
      latest.focus = firstByType_(data.rows, "focus");
      latest.admin = firstByType_(data.rows, "admin");
      latest.creative = firstByType_(data.rows, "creative");

      setTasks(
        latest.focus ? latest.focus.task : "—",
        latest.admin ? latest.admin.task : "—",
        latest.creative ? latest.creative.task : "—"
      );
    });
  }

  function firstByType_(rows, type){
    for(var i=0;i<rows.length;i++){
      var r=rows[i];
      if(String(r.type||"").toLowerCase()===type && String(r.status||"").toLowerCase()!=="done"){
        return r;
      }
    }
    return null;
  }

  function setTasks(nowT, nextT, laterT){
    document.getElementById("nowTask").innerHTML = nowT;
    document.getElementById("nextTask").innerHTML = nextT;
    document.getElementById("laterTask").innerHTML = laterT;
  }

  function markDone(type){
    var item = latest[type];
    if(!item || !item.row) return;

    xhrPost(API_URL, { action:"done", token:TOKEN, row:item.row }, function(err, text){
      // reload after marking done
      loadTasks();
    });
  }

  // initial + refresh every 60s
  loadTasks();
  setInterval(loadTasks, 60000);
</script>
</body>
</html>
