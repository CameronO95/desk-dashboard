<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta http-equiv="Cache-Control" content="no-store" />
<style>
body{
  font-family:-apple-system,system-ui,Arial,sans-serif;
  background:#111;
  color:#fff;
  margin:0;
  padding:12px;
  -webkit-text-size-adjust:100%;
}

*{ box-sizing:border-box; }

/* ===== TOP LAYOUT (OLD iPAD SAFE) ===== */
.topTable{
  width:100%;
  border-collapse:separate;
  border-spacing:12px;
  table-layout:fixed;
}

.cell{ vertical-align:top; }

.leftCell{ width:28%; }
.midCell{ width:44%; }
.rightCell{ width:28%; }

/* ===== BOXES ===== */
.box{
  background:#1c1c1e;
  border-radius:16px;
  padding:14px;
  width:100%;
}

/* vertical spacing inside each column */
.leftCell .box,
.midCell .box,
.rightCell .box{
  margin-bottom:12px;
}
.leftCell .box:last-child,
.midCell .box:last-child,
.rightCell .box:last-child{
  margin-bottom:0;
}

/* ===== CONTENT ===== */
.clock{ font-size:40px; line-height:1; }
.mode{ font-size:14px; opacity:.65; margin-top:6px; }

.calendarBox{ min-height:210px; }
.calendarTitle{ font-size:18px; opacity:.75; margin-bottom:8px; }
.calItem{ font-size:16px; line-height:1.3; margin:6px 0; opacity:.95; }
.calTime{ opacity:.65; margin-right:8px; }

.timerBox{ min-height:140px; text-align:center; }
#timer{ font-size:54px; margin:6px 0 10px; }

/* prevent long text breaking layout */
.taskText, .calItem, .spotifyTrack{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* ===== BUTTONS (CONSISTENT ON iOS) ===== */
button{
  font-size:20px;
  padding:10px 12px;
  margin:6px 0;
  border-radius:12px;
  border:0;
  color:#000;
  background:#fff;
  -webkit-appearance:none;
  appearance:none;
}
button:active{ opacity:0.75; }

.doneBtn{
  font-size:16px;
  padding:8px 10px;
  margin-left:10px;
  background:#fff;
  color:#000;
}

/* ===== TASKS ===== */
.tasks{ margin-top:12px; }
.tasks .box{ font-size:22px; }
.taskRow{ display:flex; align-items:center; margin:10px 0; }
.label{ min-width:70px; opacity:.7; }
.taskText{ flex:1; }

/* ===== SPOTIFY PANEL ===== */
.spotifyBox{
  min-height:120px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.spotifyTitle{ font-size:14px; opacity:.6; margin-bottom:6px; }
.spotifyTrack{ font-size:18px; line-height:1.2; }
.spotifyArtist{ font-size:14px; opacity:.7; }
.spotifyControls{ margin-top:10px; }
.spotifyBtn{
  font-size:16px;
  padding:8px 10px;
  margin-right:6px;
}

/* Smaller screens */
@media (max-width: 820px){
  .clock{ font-size:34px; }
  #timer{ font-size:46px; }
  .tasks .box{ font-size:20px; }
}


</style>
</head>
<body>

<!-- TOP AREA -->
<div class="row">
  <!-- LEFT: clock + calendar -->
  <table class="topTable">
  <tr>
    <!-- LEFT -->
    <td class="cell leftCell">
      <div class="box">
        <div class="clock" id="clock">--:--</div>
        <div class="mode" id="mode">MODE: —</div>
      </div>

      <div class="box calendarBox">
        <div class="calendarTitle">Today</div>

        <div id="calNowNext" class="calItem" style="margin-bottom:10px; opacity:.95;">
          <div><span class="calTime">NOW</span> <span id="calNow">—</span></div>
          <div><span class="calTime">NEXT</span> <span id="calNext">—</span></div>
        </div>

        <div id="calendarList">
          <div class="calItem">Loading…</div>
        </div>
      </div>
    </td>

    <!-- MIDDLE -->
    <td class="cell midCell">
      <div class="box timerBox">
        <div id="timer">50:00</div>
        <button onclick="startTimer(50)">50</button>
        <button onclick="startTimer(25)">25</button>
        <button onclick="startTimer(5)">Break</button>
      </div>
    </td>

    <!-- RIGHT -->
    <td class="cell rightCell">
      <div class="box quote" id="quote"><em>Stay consistent, not perfect.</em> - ChatGPT</div>

      <div class="box spotifyBox" id="spotify">
        <div class="spotifyTitle">Spotify</div>
        <div class="spotifyTrack">Not playing</div>
        <div class="spotifyArtist"></div>
        <div class="spotifyControls">
          <button class="spotifyBtn">Play</button>
          <button class="spotifyBtn">Next</button>
        </div>
      </div>
    </td>
  </tr>
</table>

<!-- BOTTOM: tasks -->
<div class="tasks">
  <div class="box">
    <div class="taskRow">
      <div class="label">NOW</div>
      <div class="taskText" id="nowTask">—</div>
      <button class="doneBtn" onclick="markDone('focus')">Done</button>
    </div>
    <div class="taskRow">
      <div class="label">NEXT</div>
      <div class="taskText" id="nextTask">—</div>
      <button class="doneBtn" onclick="markDone('admin')">Done</button>
    </div>
    <div class="taskRow">
      <div class="label">LATER</div>
      <div class="taskText" id="laterTask">—</div>
      <button class="doneBtn" onclick="markDone('creative')">Done</button>
    </div>
    <div class="taskRow">
      <div class="label">FILL</div>
      <div class="taskText" id="lightTask">—</div>
      <button class="doneBtn" onclick="markDone('light')">Done</button>
    </div>
  </div>
</div>

<script>
  var API_URL = "https://script.google.com/macros/s/AKfycbyTyWwbKxwLlj7bfKiqRiXHYPDw4PWKn5CUhCGLdayrWxHr6TRegJA3oIVlhdbv3JvN/exec";
  var TOKEN   = "c4m-desk-2026-!9x";

  var latest = { focus:null, admin:null, creative:null, light:null };

  // ===== CLOCK =====
  function pad(n){return (n<10?'0':'')+n}

  function tickClock(){
    var d = new Date();
    document.getElementById('clock').innerHTML =
      pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

// run immediately + every second
tickClock();
setInterval(tickClock, 1000);


  function firstByType_(rows, type){
    for (var i=0;i<rows.length;i++){
      var r = rows[i];
      if ((r.type||"").toLowerCase() === type && (r.status||"").toLowerCase() !== "done"){
        return r;
      }
    }
    return null;
  }

  function setTasks(nowT, nextT, laterT){
    document.getElementById("nowTask").innerHTML = nowT || "—";
    document.getElementById("nextTask").innerHTML = nextT || "—";
    document.getElementById("laterTask").innerHTML = laterT || "—";
  }

  // JSONP callback (Apps Script calls this)
  function handleTasks(data){
  // Show API errors clearly on the iPad
  if (!data) { setTasks("API returned nothing", "", ""); return; }
  if (data.error) { setTasks("API error: " + data.error, (data.message||""), ""); return; }
  if (!data.rows) { setTasks("No rows field in response", "", ""); return; }

  latest.focus = firstByType_(data.rows, "focus");
  latest.admin = firstByType_(data.rows, "admin");
  latest.creative = firstByType_(data.rows, "creative");
  latest.light = firstByType_(data.rows, "light");
  document.getElementById("lightTask").innerHTML = latest.light ? latest.light.task : "—";


  setTasks(
    latest.focus ? latest.focus.task : "—",
    latest.admin ? latest.admin.task : "—",
    latest.creative ? latest.creative.task : "—"
  );
}

  function loadTasks(){
    // Remove previous JSONP script if present
    var old = document.getElementById("jsonpTasks");
    if (old && old.parentNode) old.parentNode.removeChild(old);

    var s = document.createElement("script");
    s.id = "jsonpTasks";
    s.src = API_URL
      + "?action=list"
      + "&token=" + encodeURIComponent(TOKEN)
      + "&callback=handleTasks"
      + "&t=" + new Date().getTime(); // cache-bust
    document.body.appendChild(s);
  }

  function markDone(type){
    if (window._busyDone) return;
    window._busyDone = true;
    setTimeout(function(){ window._busyDone = false; }, 1200);

    var item = latest[type];
    if (!item || !item.row) return;

    // Use a GET beacon (old iOS friendly)
    var img = new Image();
    img.src = API_URL
      + "?action=done"
      + "&token=" + encodeURIComponent(TOKEN)
      + "&row=" + encodeURIComponent(item.row)
      + "&t=" + new Date().getTime();

    // reload after a short delay
    setTimeout(loadTasks, 600);
  }

  // initial + refresh every minute
  loadTasks();
  setInterval(loadTasks, 60000);

  //Calendar
  function handleCal(data){
  var list = document.getElementById("calendarList");
  var nowEl = document.getElementById("calNow");
  var nextEl = document.getElementById("calNext");

  if(!data){
    list.innerHTML = "<div class='calItem'>No calendar data</div>";
    nowEl.innerHTML = "—";
    nextEl.innerHTML = "—";
    return;
  }
  if(data.error){
    list.innerHTML = "<div class='calItem'>Calendar error: "+data.error+"</div>";
    nowEl.innerHTML = "—";
    nextEl.innerHTML = "—";
    return;
  }

  var evs = data.events || [];

  // Hide all-day events (your preference)
  var timed = [];
  for (var i=0;i<evs.length;i++){
    if (!evs[i].allDay) timed.push(evs[i]);
  }

  // Helpers
  function hhmmToMins(t){
    // "HH:mm"
    var parts = String(t||"").split(":");
    if(parts.length<2) return null;
    return parseInt(parts[0],10)*60 + parseInt(parts[1],10);
  }

  var d = new Date();
  var nowMins = d.getHours()*60 + d.getMinutes();

  // Determine NOW / NEXT
  var nowEvent = null;
  var nextEvent = null;

  for (var j=0;j<timed.length;j++){
    var e = timed[j];
    var s = hhmmToMins(e.start);
    var en = hhmmToMins(e.end);
    if (s === null || en === null) continue;

    if (nowMins >= s && nowMins < en){
      nowEvent = e;
      break;
    }
  }

  for (var k=0;k<timed.length;k++){
    var e2 = timed[k];
    var s2 = hhmmToMins(e2.start);
    if (s2 === null) continue;
    if (s2 > nowMins){
      nextEvent = e2;
      break;
    }
  }

  if (nowEvent){
    nowEl.innerHTML = escapeHtml_(nowEvent.title) + " (" + nowEvent.start + "–" + nowEvent.end + ")";
  } else {
    nowEl.innerHTML = "Free";
  }

  if (nextEvent){
    var minsTo = hhmmToMins(nextEvent.start) - nowMins;
    var inTxt = minsTo <= 1 ? "now" : ("in " + minsTo + " mins");
    nextEl.innerHTML = escapeHtml_(nextEvent.title) + " — " + nextEvent.start + " (" + inTxt + ")";
  } else {
    nextEl.innerHTML = "Nothing else today";
  }

  // Render full agenda (timed only)
  if(timed.length === 0){
    list.innerHTML = "<div class='calItem'>No timed events today</div>";
    return;
  }

  var html = "";
  for(var x=0;x<timed.length;x++){
    var e3 = timed[x];
    var when = e3.start + "–" + e3.end;
    html += "<div class='calItem'><span class='calTime'>"+when+"</span>"+escapeHtml_(e3.title)+"</div>";
  }
  list.innerHTML = html;
}


function loadCalendar(){
  var old = document.getElementById("jsonpCal");
  if(old && old.parentNode) old.parentNode.removeChild(old);

  var s = document.createElement("script");
  s.id = "jsonpCal";
  s.src = API_URL
    + "?action=cal"
    + "&token=" + encodeURIComponent(TOKEN)
    + "&callback=handleCal"
    + "&t=" + new Date().getTime();
  document.body.appendChild(s);
}

function escapeHtml_(str){
  str = String(str || "");
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// Load once + refresh every 5 mins
loadCalendar();
setInterval(loadCalendar, 300000);

</script>

</body>
</html>
