<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store" />
<style>
  body{font-family:-apple-system,system-ui,Arial,sans-serif;background:#111;color:#fff;margin:0;padding:14px}
  .row{display:flex;gap:12px}
  .col{display:flex;flex-direction:column;gap:12px}
  .box{background:#1c1c1e;border-radius:16px;padding:14px;box-sizing:border-box}
  .left{width:28%}
  .mid{width:44%}
  .right{width:28%}

  .clock{font-size:40px;line-height:1}
  .mode{font-size:14px;opacity:.65;margin-top:6px}

  .calendarBox{flex:1;min-height:200px}
  .calendarTitle{font-size:18px;opacity:.75;margin-bottom:8px}
  .calItem{font-size:16px;line-height:1.3;margin:6px 0;opacity:.95}
  .calTime{opacity:.65;margin-right:8px}

  .timerBox{min-height:120px;text-align:center}
  #timer{font-size:54px;margin:6px 0 10px}
  button{font-size:20px;padding:10px 12px;margin:5px;border-radius:12px;border:0}

  .quote{min-height:70px;font-size:16px;opacity:.75}
  .spotify{min-height:90px;font-size:16px;opacity:.9}

  .tasks{margin-top:12px}
  .tasks .box{font-size:22px}
  .taskRow{display:flex;align-items:center;gap:10px;margin:10px 0}
  .label{min-width:70px;opacity:.7}
  .taskText{flex:1}
  .doneBtn{font-size:16px;padding:8px 10px;border-radius:12px}

  /* Makes it fit smaller iPad screens */
  @media (max-width: 820px){
    body{padding:10px}
    .clock{font-size:34px}
    #timer{font-size:46px}
    .tasks .box{font-size:20px}
  }
</style>
</head>
<body>

<!-- TOP AREA -->
<div class="row">
  <!-- LEFT: clock + calendar -->
  <div class="col left">
    <div class="box">
      <div class="clock" id="clock">--:--</div>
      <div class="mode" id="mode">MODE: —</div>
    </div>

    <div class="box calendarBox">
      <div class="calendarTitle">Today</div>
      <div id="calendarList">
        <div class="calItem">Loading…</div>
      </div>
    </div>
  </div>

  <!-- MIDDLE: timer -->
  <div class="col mid">
    <div class="box timerBox">
      <div id="timer">50:00</div>
      <button onclick="startTimer(50)">50</button>
      <button onclick="startTimer(25)">25</button>
      <button onclick="startTimer(5)">Break</button>
    </div>
  </div>

  <!-- RIGHT: quote + spotify -->
  <div class="col right">
    <div class="box quote" id="quote">Stay consistent, not perfect.</div>
    <div class="box spotify" id="spotify">
      Spotify: use your phone / PC for playback, this panel stays calm.
    </div>
  </div>
</div>

<!-- BOTTOM: tasks -->
<div class="tasks">
  <div class="box">
    <div class="taskRow">
      <div class="label">NOW</div>
      <div class="taskText" id="nowTask">—</div>
      <button class="doneBtn" onclick="markDone('focus')">Done</button>
    </div>
    <div class="taskRow">
      <div class="label">NEXT</div>
      <div class="taskText" id="nextTask">—</div>
      <button class="doneBtn" onclick="markDone('admin')">Done</button>
    </div>
    <div class="taskRow">
      <div class="label">LATER</div>
      <div class="taskText" id="laterTask">—</div>
      <button class="doneBtn" onclick="markDone('creative')">Done</button>
    </div>
    <div class="taskRow">
      <div class="label">FILL</div>
      <div class="taskText" id="lightTask">—</div>
      <button class="doneBtn" onclick="markDone('light')">Done</button>
    </div>
  </div>
</div>

<script>
  var API_URL = "https://script.google.com/macros/s/AKfycbyTyWwbKxwLlj7bfKiqRiXHYPDw4PWKn5CUhCGLdayrWxHr6TRegJA3oIVlhdbv3JvN/exec";
  var TOKEN   = "c4m-desk-2026-!9x";

  var latest = { focus:null, admin:null, creative:null, light:null };

  // ===== CLOCK =====
  function pad(n){return (n<10?'0':'')+n}

  function tickClock(){
    var d = new Date();
    document.getElementById('clock').innerHTML =
      pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

// run immediately + every second
tickClock();
setInterval(tickClock, 1000);


  function firstByType_(rows, type){
    for (var i=0;i<rows.length;i++){
      var r = rows[i];
      if ((r.type||"").toLowerCase() === type && (r.status||"").toLowerCase() !== "done"){
        return r;
      }
    }
    return null;
  }

  function setTasks(nowT, nextT, laterT){
    document.getElementById("nowTask").innerHTML = nowT || "—";
    document.getElementById("nextTask").innerHTML = nextT || "—";
    document.getElementById("laterTask").innerHTML = laterT || "—";
  }

  // JSONP callback (Apps Script calls this)
  function handleTasks(data){
  // Show API errors clearly on the iPad
  if (!data) { setTasks("API returned nothing", "", ""); return; }
  if (data.error) { setTasks("API error: " + data.error, (data.message||""), ""); return; }
  if (!data.rows) { setTasks("No rows field in response", "", ""); return; }

  latest.focus = firstByType_(data.rows, "focus");
  latest.admin = firstByType_(data.rows, "admin");
  latest.creative = firstByType_(data.rows, "creative");
  latest.light = firstByType_(data.rows, "light");
  document.getElementById("lightTask").innerHTML = latest.light ? latest.light.task : "—";


  setTasks(
    latest.focus ? latest.focus.task : "—",
    latest.admin ? latest.admin.task : "—",
    latest.creative ? latest.creative.task : "—"
  );
}

  function loadTasks(){
    // Remove previous JSONP script if present
    var old = document.getElementById("jsonpTasks");
    if (old && old.parentNode) old.parentNode.removeChild(old);

    var s = document.createElement("script");
    s.id = "jsonpTasks";
    s.src = API_URL
      + "?action=list"
      + "&token=" + encodeURIComponent(TOKEN)
      + "&callback=handleTasks"
      + "&t=" + new Date().getTime(); // cache-bust
    document.body.appendChild(s);
  }

  function markDone(type){
    if (window._busyDone) return;
    window._busyDone = true;
    setTimeout(function(){ window._busyDone = false; }, 1200);

    var item = latest[type];
    if (!item || !item.row) return;

    // Use a GET beacon (old iOS friendly)
    var img = new Image();
    img.src = API_URL
      + "?action=done"
      + "&token=" + encodeURIComponent(TOKEN)
      + "&row=" + encodeURIComponent(item.row)
      + "&t=" + new Date().getTime();

    // reload after a short delay
    setTimeout(loadTasks, 600);
  }

  // initial + refresh every minute
  loadTasks();
  setInterval(loadTasks, 60000);

  //Calendar
  function handleCal(data){
  var list = document.getElementById("calendarList");
  if(!data){ list.innerHTML = "<div class='calItem'>No calendar data</div>"; return; }
  if(data.error){ list.innerHTML = "<div class='calItem'>Calendar error: "+data.error+"</div>"; return; }

  var evs = data.events || [];
  if(evs.length === 0){
    list.innerHTML = "<div class='calItem'>No events today</div>";
    return;
  }

  var html = "";
  for(var i=0;i<evs.length;i++){
    var e = evs[i];
    var when = e.allDay ? "All day" : (e.start + "–" + e.end);
    html += "<div class='calItem'><span class='calTime'>"+when+"</span>"+escapeHtml_(e.title)+"</div>";
  }
  list.innerHTML = html;
}

function loadCalendar(){
  var old = document.getElementById("jsonpCal");
  if(old && old.parentNode) old.parentNode.removeChild(old);

  var s = document.createElement("script");
  s.id = "jsonpCal";
  s.src = API_URL
    + "?action=cal"
    + "&token=" + encodeURIComponent(TOKEN)
    + "&callback=handleCal"
    + "&t=" + new Date().getTime();
  document.body.appendChild(s);
}

function escapeHtml_(str){
  str = String(str || "");
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// Load once + refresh every 5 mins
loadCalendar();
setInterval(loadCalendar, 300000);

</script>

</body>
</html>
