<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store" />
<style>
  body{font-family:-apple-system,system-ui,Arial,sans-serif;background:#111;color:#fff;margin:0;padding:14px}
  .row{display:flex;gap:12px}
  .col{display:flex;flex-direction:column;gap:12px}
  .box{background:#1c1c1e;border-radius:16px;padding:14px;box-sizing:border-box}
  .left{width:28%}
  .mid{width:44%}
  .right{width:28%}

  .clock{font-size:40px;line-height:1}
  .mode{font-size:14px;opacity:.65;margin-top:6px}

  .calendarBox{flex:1;min-height:200px}
  .calendarTitle{font-size:18px;opacity:.75;margin-bottom:8px}
  .calItem{font-size:16px;line-height:1.3;margin:6px 0;opacity:.95}
  .calTime{opacity:.65;margin-right:8px}

  .timerBox{min-height:120px;text-align:center}
  #timer{font-size:54px;margin:6px 0 10px}
  button{font-size:20px;padding:10px 12px;margin:5px;border-radius:12px;border:0}

  .quote{min-height:70px;font-size:16px;opacity:.75}
  .spotify{min-height:90px;font-size:16px;opacity:.9}

  .tasks{margin-top:12px}
  .tasks .box{font-size:22px}
  .taskRow{display:flex;align-items:center;gap:10px;margin:10px 0}
  .label{min-width:70px;opacity:.7}
  .taskText{flex:1}
  .doneBtn{font-size:16px;padding:8px 10px;border-radius:12px}

  /* Makes it fit smaller iPad screens */
  @media (max-width: 820px){
    body{padding:10px}
    .clock{font-size:34px}
    #timer{font-size:46px}
    .tasks .box{font-size:20px}
  }
</style>
</head>
<body>

<!-- TOP AREA -->
<div class="row">
  <!-- LEFT: clock + calendar -->
  <div class="col left">
    <div class="box">
      <div class="clock" id="clock">--:--</div>
      <div class="mode" id="mode">MODE: —</div>
    </div>

    <div class="box calendarBox">
      <div class="calendarTitle">Today</div>
      <div id="calendarList">
        <div class="calItem">Loading…</div>
      </div>
    </div>
  </div>

  <!-- MIDDLE: timer -->
  <div class="col mid">
    <div class="box timerBox">
      <div id="timer">50:00</div>
      <button onclick="startTimer(50)">50</button>
      <button onclick="startTimer(25)">25</button>
      <button onclick="startTimer(5)">Break</button>
    </div>
  </div>

  <!-- RIGHT: quote + spotify -->
  <div class="col right">
    <div class="box quote" id="quote">Stay consistent, not perfect.</div>
    <div class="box spotify" id="spotify">
      Spotify: use your phone / PC for playback, this panel stays calm.
    </div>
  </div>
</div>

<!-- BOTTOM: tasks -->
<div class="tasks">
  <div class="box">
    <div class="taskRow">
      <div class="label">NOW</div>
      <div class="taskText" id="nowTask">—</div>
      <button class="doneBtn" onclick="markDone('focus')">Done</button>
    </div>
    <div class="taskRow">
      <div class="label">NEXT</div>
      <div class="taskText" id="nextTask">—</div>
      <button class="doneBtn" onclick="markDone('admin')">Done</button>
    </div>
    <div class="taskRow">
      <div class="label">LATER</div>
      <div class="taskText" id="laterTask">—</div>
      <button class="doneBtn" onclick="markDone('creative')">Done</button>
    </div>
  </div>
</div>

<script>
  // ====== CONFIG ======
  var API_URL = "https://script.google.com/macros/s/AKfycbw_bqVsxfz3hKlfoqdWXYBjRnYXIs_Flchi4svbdLUL6QsY9uIjLmg91yq4EpGx8q3R/exec";
  var TOKEN   = "c4m-desk-2026-!9x";

  // ====== CLOCK + MODE ======
  function pad(n){return (n<10?'0':'')+n}
  function currentModeLabel_(mins){
    // Focus: 07:30–10:00
    if (mins>=450 && mins<600) return "FOCUS";
    // Admin: 10:00–13:00
    if (mins>=600 && mins<780) return "ADMIN";
    // Creative: 13:00–17:30
    if (mins>=780 && mins<1050) return "CREATIVE";
    // Evening optional: 19:30–22:30
    if (mins>=1170 && mins<1350) return "EVENING";
    return "OFF";
  }
  function tickClock(){
    var d=new Date();
    var mins=d.getHours()*60+d.getMinutes();
    document.getElementById('clock').innerHTML = pad(d.getHours())+':'+pad(d.getMinutes());
    document.getElementById('mode').innerHTML = "MODE: " + currentModeLabel_(mins);
  }
  setInterval(tickClock, 1000); tickClock();

  // ====== TIMER ======
  var tInt=null, tSec=50*60;
  function renderTimer(){
    var m=Math.floor(tSec/60), s=tSec%60;
    document.getElementById('timer').innerHTML = m+':'+(s<10?'0':'')+s;
  }
  function startTimer(mins){
    if(tInt) clearInterval(tInt);
    tSec=mins*60;
    renderTimer();
    tInt=setInterval(function(){
      tSec--;
      if(tSec<=0){ tSec=0; renderTimer(); clearInterval(tInt); tInt=null; return; }
      renderTimer();
    },1000);
  }

  // ====== XHR helpers (older iOS) ======
  function xhrGet(url, cb){
    var x=new XMLHttpRequest();
    x.onreadystatechange=function(){
      if(x.readyState===4){
        if(x.status>=200 && x.status<300) cb(null, x.responseText);
        else cb(new Error("HTTP "+x.status));
      }
    };
    x.open("GET", url, true);
    x.send();
  }
  function xhrPost(url, obj, cb){
    var x=new XMLHttpRequest();
    x.onreadystatechange=function(){
      if(x.readyState===4){
        if(x.status>=200 && x.status<300) cb(null, x.responseText);
        else cb(new Error("HTTP "+x.status));
      }
    };
    x.open("POST", url, true);
    x.setRequestHeader("Content-Type", "text/plain;charset=utf-8");
    x.send(JSON.stringify(obj));
  }

  // ====== TASKS ======
  var latest = { focus:null, admin:null, creative:null };

  function firstByType_(rows, type){
    for(var i=0;i<rows.length;i++){
      var r=rows[i];
      if(String(r.type||"").toLowerCase()===type && String(r.status||"").toLowerCase()!=="done"){
        return r;
      }
    }
    return null;
  }

  function setTasks(nowT, nextT, laterT){
    document.getElementById("nowTask").innerHTML = nowT || "—";
    document.getElementById("nextTask").innerHTML = nextT || "—";
    document.getElementById("laterTask").innerHTML = laterT || "—";
  }

  function loadTasks(){
    // cache-bust for old safari
    var url = API_URL + "?action=list&token=" + encodeURIComponent(TOKEN) + "&t=" + new Date().getTime();
    xhrGet(url, function(err, text){
      if(err){ setTasks("Couldn’t load", "Check iPad Safari", ""); return; }
      var data;
      try{ data=JSON.parse(text); }catch(e){ setTasks("Bad response", "", ""); return; }
      if(!data.rows){ setTasks("No rows", "", ""); return; }

      latest.focus = firstByType_(data.rows, "focus");
      latest.admin = firstByType_(data.rows, "admin");
      latest.creative = firstByType_(data.rows, "creative");

      setTasks(
        latest.focus ? latest.focus.task : "—",
        latest.admin ? latest.admin.task : "—",
        latest.creative ? latest.creative.task : "—"
      );
    });
  }

  function markDone(type){
    var item = latest[type];
    if(!item || !item.row) return;

    xhrPost(API_URL, { action:"done", token:TOKEN, row:item.row }, function(){
      loadTasks();
    });
  }

  loadTasks();
  setInterval(loadTasks, 60000);

  // ====== CALENDAR (basic via ICS feed) ======
  // We’ll plug this in next once tasks are stable on iPad.
  document.getElementById("calendarList").innerHTML =
    '<div class="calItem">Calendar: next step (ICS feed)</div>';
</script>

</body>
</html>
